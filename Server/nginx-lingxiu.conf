server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 182.92.71.158;

    ssl_certificate /etc/lingxiu-api/tls/cert.pem;
    ssl_certificate_key /etc/lingxiu-api/tls/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_timeout 10m;

    server_tokens off;
    client_max_body_size 20m;
    access_log /var/log/nginx/lingxiu_access.log combined;
    error_log /var/log/nginx/lingxiu_error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v1/responses {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 110s;
        proxy_read_timeout 110s;
    }

    location / {
        return 404;
    }
}
