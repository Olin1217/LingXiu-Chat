openapi: 3.1.0
info:
  title: LingXiu API
  version: 1.0.1
  description: |
    灵嗅 iOS MVP 后端契约。`/health`、`/healthz` 和 `/v1/responses`
    已实现；其余接口是数据库、正式登录和隐私机制就绪后的稳定预留。
servers:
  - url: https://api.example.com
    description: 正式域名（待购买和备案）
  - url: https://182.92.71.158
    description: IP 证书固定联调环境
tags:
  - name: System
  - name: AI
  - name: Account
  - name: Profiles
  - name: Analysis
  - name: Inspiration
paths:
  /health:
    get:
      tags: [System]
      summary: 健康检查
      x-lingxiu-status: implemented
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /healthz:
    get:
      tags: [System]
      summary: 兼容健康检查
      x-lingxiu-status: implemented
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/responses:
    post:
      tags: [AI]
      summary: 隐私收敛后的火山方舟 Responses 代理
      description: 服务端固定模型、关闭存储、限制输入类型，并注入 Ark API Key。
      x-lingxiu-status: implemented
      security:
        - ProxyToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
      responses:
        '200':
          description: 方舟响应
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: 请求过于频繁
        '502':
          description: 上游模型暂时不可用
  /v1/auth/guest:
    post:
      tags: [Account]
      summary: 创建游客会话
      x-lingxiu-status: planned
      responses:
        '201':
          description: 短期游客会话令牌
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in]
                properties:
                  access_token: {type: string}
                  expires_in: {type: integer}
  /v1/me:
    get:
      tags: [Account]
      summary: 当前用户
      x-lingxiu-status: planned
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 用户信息
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Account]
      summary: 注销账户及服务端数据
      x-lingxiu-status: planned
      security:
        - BearerAuth: []
      responses:
        '202':
          description: 注销任务已受理
  /v1/persons:
    get:
      tags: [Profiles]
      summary: 沟通角色卡与身份卡列表
      x-lingxiu-status: planned
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 角色卡列表
    post:
      tags: [Profiles]
      summary: 创建角色卡
      x-lingxiu-status: planned
      security:
        - BearerAuth: []
      responses:
        '201':
          description: 创建成功
  /v1/persons/{person_id}:
    parameters:
      - in: path
        name: person_id
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Profiles]
      summary: 获取角色卡
      x-lingxiu-status: planned
      security:
        - BearerAuth: []
      responses:
        '200': {description: 角色卡}
        '404': {description: 不存在}
    put:
      tags: [Profiles]
      summary: 更新角色卡
      x-lingxiu-status: planned
      security:
        - BearerAuth: []
      responses:
        '200': {description: 更新成功}
    delete:
      tags: [Profiles]
      summary: 删除角色卡
      x-lingxiu-status: planned
      security:
        - BearerAuth: []
      responses:
        '204': {description: 删除成功}
  /v1/analysis:
    get:
      tags: [Analysis]
      summary: 分析历史
      x-lingxiu-status: planned
      security:
        - BearerAuth: []
      responses:
        '200': {description: 分析历史}
    post:
      tags: [Analysis]
      summary: 创建沟通分析并原子扣减积分
      x-lingxiu-status: planned
      security:
        - BearerAuth: []
      responses:
        '201': {description: 分析完成}
        '402': {description: 积分不足}
  /v1/analysis/{analysis_id}:
    get:
      tags: [Analysis]
      summary: 获取单次分析
      x-lingxiu-status: planned
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: analysis_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: 分析内容}
        '404': {description: 不存在}
  /v1/inspiration:
    get:
      tags: [Inspiration]
      summary: 积分余额与收支记录
      x-lingxiu-status: planned
      security:
        - BearerAuth: []
      responses:
        '200': {description: 积分信息}
components:
  securitySchemes:
    ProxyToken:
      type: apiKey
      in: header
      name: X-LingXiu-Proxy-Token
      description: 联调期可轮换代理令牌，后续由 App Attest 与短期令牌替代。
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status, api_version, ark_configured, model]
      properties:
        status: {type: string, const: ok}
        api_version: {type: string, const: v1}
        ark_configured: {type: boolean}
        model: {type: string}
    ResponsesRequest:
      type: object
      required: [input]
      properties:
        input:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role: {type: string, const: user}
              content:
                type: array
                minItems: 1
                maxItems: 4
                items:
                  oneOf:
                    - type: object
                      required: [type, text]
                      properties:
                        type: {type: string, const: input_text}
                        text: {type: string, maxLength: 24000}
                    - type: object
                      required: [type, image_url]
                      properties:
                        type: {type: string, const: input_image}
                        image_url:
                          type: string
                          pattern: '^data:image/'
        store: {type: boolean, const: false}
        max_output_tokens: {type: integer, minimum: 256, maximum: 4096}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code: {type: string}
            message: {type: string}
  responses:
    BadRequest:
      description: 输入不符合服务端白名单
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: 未授权
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
