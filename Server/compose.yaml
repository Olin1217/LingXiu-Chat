name: lingxiu

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lingxiu-api:local
    env_file:
      - .env
    environment:
      LINGXIU_LISTEN_HOST: 0.0.0.0
      LINGXIU_LISTEN_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # This profile is intentionally not started yet. It becomes active after
  # authentication, privacy terms and an off-server backup target are ready:
  #   docker compose --profile database up -d
  postgres:
    image: postgres:17-alpine
    profiles: ["database"]
    environment:
      POSTGRES_DB: lingxiu
      POSTGRES_USER: lingxiu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingxiu -d lingxiu"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
